name: Build Ali_Lien ETHW Widget

on:
  push:
    branches: [ethw-widget-v01]
    paths: ['android-widget/**', '.github/workflows/build-ethw-widget.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android-widget
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Ali_Lien_ETHW_Widget-v0.1-debug
          path: android-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
